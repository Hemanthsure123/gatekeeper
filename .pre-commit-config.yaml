# Run `make setup` to install these hooks. Versions verified against upstream
# release tags on 2026-10-25; Dependabot does not bump this file, so run
# `uv run pre-commit autoupdate` periodically and keep ruff in step with uv.lock.
minimum_pre_commit_version: "4.0.0"
# The demo PR "whitespace-noise" is deliberately badly formatted.
exclude: ^demo/prs/2-whitespace-noise/

repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.2
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: detect-private-key
