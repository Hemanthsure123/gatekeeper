name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: nothing at the workflow level; each job asks for read-only contents.
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck, test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    services:
      postgres:
        # Keep in step with docker-compose.yml. Throwaway CI database: trust auth, no secret.
        image: postgres:16.15-alpine
        env:
          POSTGRES_USER: gatekeeper
          POSTGRES_DB: gatekeeper
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gatekeeper -d gatekeeper"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # With CI set, integration tests fail (instead of skipping) if Postgres is missing.
      APP_ENV: test
      DATABASE_URL: postgresql://gatekeeper@localhost:5432/gatekeeper
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.5"
          enable-cache: true

      - name: Install dependencies (locked)
        run: uv sync --locked --all-extras

      - name: File hygiene hooks
        run: uv run pre-commit run --all-files --show-diff-on-failure
        env:
          SKIP: gitleaks # covered by the secret-scan job

      - name: Lint
        run: make lint

      - name: Typecheck
        run: make typecheck

      - name: Test with coverage (unit + integration)
        run: make test

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks (checksum-verified)
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "${RUNNER_TEMP}/${archive}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${RUNNER_TEMP}/${archive}" | sha256sum --check --strict
          tar -xzf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}" gitleaks
          echo "${RUNNER_TEMP}" >> "${GITHUB_PATH}"

      - name: Scan git history
        run: gitleaks git --redact --verbose --exit-code 1 .
