[project]
name = "gatekeeper"
version = "0.0.0"
description = "Local-first, open-model GitHub triage for pull requests, issues and comments."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.1",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.1",
    "pyjwt[crypto]>=2.15.1",
    "redis>=8.1.0",
    "sqlalchemy>=2.1.6,<2.2",
    "structlog>=26.1.0",
    "uvicorn>=0.54.0",
]

[project.optional-dependencies]
gemini = [
    "google-genai>=2.33.0",
]

[project.scripts]
gatekeeper = "gatekeeper.cli:main"

[dependency-groups]
dev = [
    "fakeredis>=2.40.0",
    "mypy>=2.4.0",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "respx>=0.23.1",
    "ruff>=0.17.2",
]

[build-system]
requires = ["uv_build>=0.13.5,<0.14"]
build-backend = "uv_build"

[tool.uv]
required-version = ">=0.13.5"

[tool.uv.build-backend]
module-name = "gatekeeper"
module-root = "backend/src"

[tool.ruff]
line-length = 100
# The demo pack is playground content, not Gatekeeper code (one PR is noisy on purpose).
extend-exclude = ["demo"]
src = ["backend/src", "backend/tests", "scripts"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "C4",  # flake8-comprehensions
    "PTH", # flake8-use-pathlib
    "PT",  # flake8-pytest-style
    "S",   # flake8-bandit (security)
    "N",   # pep8-naming
    "RUF", # ruff-specific
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "S105", "S106"] # asserts and obviously fake credentials
"backend/alembic/versions/*" = ["N999"]  # revision files start with their number

[tool.mypy]
strict = true
python_version = "3.13"
files = ["backend/src", "backend/tests", "backend/alembic/env.py", "scripts"]
mypy_path = "backend/src,scripts,backend/tests"
explicit_package_bases = true
warn_unreachable = true

[tool.pytest]
minversion = "9.0"
strict = true
testpaths = ["backend/tests", "scripts/tests"]
pythonpath = ["scripts", "backend/tests"]
addopts = ["-ra", "--import-mode=importlib", "--cov", "--cov-report=term-missing"]
filterwarnings = ["error"]
markers = [
    "integration: needs Postgres; skipped locally when unreachable, required in CI",
]

[tool.alembic]
script_location = "%(here)s/backend/alembic"

[tool.coverage.run]
branch = true
source = ["backend/src/gatekeeper", "scripts"]
omit = ["scripts/tests/*"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = false
exclude_also = ['if __name__ == "__main__":']
